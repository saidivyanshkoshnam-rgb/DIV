services:
  - type: web
    name: study-day-agent
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: HOST
        value: 0.0.0.0
      - key: PUBLIC_HTTPS
        value: "1"
      - key: STUDY_DAY_DATA_DIR
        value: /var/data
      - key: SARVAM_API_KEY
        sync: false
    disk:
      name: study-day-data
      mountPath: /var/data
      sizeGB: 1
